[workspace]
authors = ["Hugo Kerino <hugo.kerino@utoulouse.fr>"]
channels = ["conda-forge"]
name = "models_on_nextoso"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
numpy = ">=2.4.2,<3"
netcdf4 = ">=1.7.4,<2"
xarray = ">=2024.5.0,<2025"
pandas = "==2.2.2" 
geopandas = ">=1.1.2,<2"
matplotlib = ">=3.10.8,<4"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"
torchvision = ">=0.25.0,<0.26"
lightning = ">=2.6.1,<3"
torchmetrics = ">=1.8.2,<2"
mlflow = ">=1.2.0,<2"
tensorboard = ">=2.20.0,<3"
setuptools = "==81.0"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.8.0,<2"
einops = ">=0.8.2,<0.9"
rasterio = ">=1.5.0,<2"
rioxarray = ">=0.21.0,<0.22"
dask = ">=2026.3.0,<2027"
yaml = ">=0.2.5,<0.3"

# Environnement CPU (pour le développement local)
[feature.cpu.dependencies]
pytorch-cpu = ">=2.10"  # Version CPU de PyTorch

# Environnement GPU (pour le cluster)
[feature.gpu.system-requirements]
cuda = "12.4"  # Version de CUDA sur le cluster

[feature.gpu.dependencies]
cuda-version = ">=12.4"  # Version de CUDA
pytorch-gpu = ">=2.10"   # Version GPU de PyTorch

# Définition des environnements
[environments]
cpu = ["cpu"]   # Environnement CPU (héritant des dépendances communes + pytorch-cpu)
gpu = ["gpu"]   # Environnement GPU (héritant des dépendances communes + pytorch-gpu)
default = ["cpu"]
