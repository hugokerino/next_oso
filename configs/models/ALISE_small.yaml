model: ALISE
mask_need: false

encoder:
  embedding_dim: 32
  sse:
    inplanes: 10
    encoder_widths: [64, 64, 128]
    decoder_widths: [32, 64, 128]
    encoder_norm: group
    padding_mode: reflect
    decoding_norm: group
    return_maps: false
    str_conv_k: 4
    str_conv_s: 2
    str_conv_p: 1
    skip_conv_norm: group
  transformer:
    d_model: 32
    nhead: 4
    dim_feedforward: 64
    dropout: 0.1
    batch_first: true
    num_layers: 1
  temporal_projector:
    n_head: 2
    d_k: 16
    n_q: 5

decoder:
  mlp: [160, 25]
  dropout: 0.1