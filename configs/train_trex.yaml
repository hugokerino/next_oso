# Paths
path_s2: /work/THEIA/CES/oso/hugok/s2_data
path_mnt: /work/THEIA/CES/oso/hugok/mnt_data
path_label: /work/THEIA/CES/oso/hugok/labels
path_oso_classes: /work/THEIA/CES/oso/hugok/files_s2/oso_classes.csv
path_logs: /work/THEIA/CES/oso/hugok/next_oso/logs/light_training

# Data
num_worker: 4
label_type: max_class
num_class: 25
folds_train: [1, 2, 3]
folds_val: [4]
folds_test: [5]
sequence_packing: false

# Training
criterion : cross_entropy
optimizer_scheduler : reduce_on_plateau
epochs_max: 200
batch_size: 2
test_model: false
accelerator:  "gpu"
devices: 1
nodes: 1
strategy: "auto"
running_on_trex_gpu: true
num_sample_lr_finder : 1000
learning_rate: 0.00001
logs : True
use_spatial_coords : false
