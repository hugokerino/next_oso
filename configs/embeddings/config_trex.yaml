# Data & model
dataset : next_oso
model : malice

# Paths
path_data : /work/THEIA/CES/oso/hugok/nextoso-dataset
path_logs : /work/THEIA/CES/oso/hugok/next_oso/logs

# Data settings
label_type : max_class
label_type_test : max_class
preload_data : false
num_worker: 4
num_class: 25

# Folds for kfold
folds :
  - [[1,2,3], [4], [5]] # fold_index 0
  - [[2,3,4], [5], [1]] # fold_index 1
  - [[3,4,5], [1], [2]] # fold_index 2
  - [[4,5,1], [2], [3]] # fold_index 3
  - [[5,1,2], [3], [4]] # fold_index 4

# Training arguments
decoder_type : mlp # mlp or cnn
criterion : cross_entropy
optimizer_scheduler : reduce_on_plateau
batch_size : 64
lr : 0.001
max_epochs : 1000
dropout : 0.1
test_model : false
