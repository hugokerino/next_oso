# Paths
path_data: /work/THEIA/CES/oso/hugok/nextoso-dataset
path_logs: /work/THEIA/CES/oso/hugok/next_oso/logs/light_training

# Data
label_type: max_class
label_type_test : max_class
use_mnt_data: True
num_worker: 4
num_class: 25
folds :
  - [[1,2,3], [4], [5]] # = fold_index 0
  - [[2,3,4], [5], [1]] # = fold_index 1
  - [[3,4,5], [1], [2]] # = fold_index 2
  - [[4,5,1], [2], [3]] # = fold_index 3
  - [[5,1,2], [3], [4]] # = fold_index 4

# Training
decoder_type: mlp #choose among "mlp" or "cnn"
criterion : cross_entropy
optimizer_scheduler : reduce_on_plateau
epochs_max: 300
batch_size: null # int or None (then choose automatically with respect to the model used)
test_model: false
accelerator:  "gpu"
devices: 1
nodes: 1
strategy: "auto" #choose among "auto" 'ddp', 'ddp_unused_parameters', 'ddp_find_unused_parameters_true' #UTAE  is not compatible with DDP
running_on_trex_gpu: true
learning_rate: 0.0001
logs : True
