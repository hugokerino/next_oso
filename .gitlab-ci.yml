stages:
  - lint
  - test

image: ubuntu:24.04

before_script:
  - apt-get update
  - apt-get install -y curl make
  - curl -fsSL https://pixi.sh/install.sh | bash
  - export PATH="$HOME/.pixi/bin:$PATH"
  - pixi install -e dev

cache:
  key: pixi-cache
  paths:
    - .pixi/

ruff:
  stage: lint
  script:
    - make ruff

mypy:
  stage: lint
  script:
    - make mypy

pytest:
  stage: test
  script:
    - make test
