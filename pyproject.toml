[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "next-oso"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "supervised_models*",
    "embedding*",
    "analyse_results*",
    "data_functions*",
    "RandomForest*",
    "src*",
    "pastis*",
    "mains*",
    "test*",
    "templates*",
]

[tool.ruff]
exclude = ["analyse_results/", "old/", "test/"]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "import-untyped"
]
exclude = [
    "old/",
    "analyse_results/",
]
show_error_codes = true

[tool.coverage.run]
source_pkgs = ["next_oso"]
omit = ["./tests/*", "./.pixi/*"]
