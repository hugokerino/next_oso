[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"  

[project]
name = "next-oso"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Alise*",
    "alpha_earth*",
    "analyse_results*",
    "data_functions*",
    "RandomForest*",
    "src*",
    "pastis*",
    "mains*",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"test/*" = ["F401"]  
"analyse_results/*.ipynb" = ["E741", "F841"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "import-untyped"
]
exclude = [
    "old/",
    "analyse_results/",
]
show_error_codes = true

[tool.coverage.run]
source_pkgs = ["next_oso"]
omit = ["./tests/*", "./.pixi/*"]
