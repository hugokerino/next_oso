[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"  

[project]
name = "next-oso"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Alise*",
    "alpha_earth*",
    "analyse_results*",
    "data_functions*",
    "RandomForest*",
    "src*",
    "pastis*",
    "mains*",
]